name: Deploy

# main 에 push 되면 배포 호스트로 SSH 접속해 최신 코드로 재배포한다.
# 시크릿은 전부 GitHub Secrets/Variables 에서 주입 → 호스트엔 배포 시점에만 deploy/.env 로 써진다.
# (수동 실행도 가능: Actions 탭 → Deploy → Run workflow)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 배포가 겹치지 않게 직렬화(진행 중이면 새 배포는 대기).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: 타입체크 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FE 의존 설치
        working-directory: frontend
        run: npm ci
      - name: FE 타입체크
        working-directory: frontend
        run: npm run typecheck

  deploy:
    name: 호스트 재배포
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # 아래 env 를 원격 셸로 전달(값 자체는 로그에 마스킹됨).
          envs: ANTHROPIC_API_KEY,CHAT_ADMIN_TOKEN,SITE_ADDRESS,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            : "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY secret 미설정}"

            cd "${DEPLOY_PATH:-$HOME/Project_PO}"
            git pull --ff-only

            # 시크릿 → 호스트 deploy/.env (0600). 이 파일은 gitignore 라 커밋 안 됨.
            cd deploy
            umask 077
            cat > .env <<EOF
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            SITE_ADDRESS=${SITE_ADDRESS:-:80}
            CHAT_ADMIN_TOKEN=${CHAT_ADMIN_TOKEN:-}
            EOF

            # 바뀐 이미지만 재빌드·교체(빌드 실패 시 기존 컨테이너 유지 → 무중단 안전).
            docker compose up -d --build
            docker image prune -f

            # 가벼운 헬스체크 — backend 가 컨테이너 내부에서 응답하는지 최대 30초 대기.
            for i in $(seq 1 15); do
              if docker compose exec -T backend python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/projects', timeout=3)" 2>/dev/null; then
                echo "healthcheck OK"; break
              fi
              if [ "$i" = "15" ]; then echo "healthcheck 실패 — 로그 확인 필요" >&2; docker compose ps; exit 1; fi
              sleep 2
            done
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAT_ADMIN_TOKEN: ${{ secrets.CHAT_ADMIN_TOKEN }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
